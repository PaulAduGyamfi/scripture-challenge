# AI pull request review, based on the code-review example in the Claude Code GitHub Actions docs
# (code.claude.com/docs/en/github-actions). Advisory only: it isn't a required status check, it
# can't approve, and the maintainer decides every merge (docs/development-workflow.md §8).
#
# Runs once per PR (opened, reopened, ready for review), not on every push, to control cost.
# Needs the Claude GitHub App on the repo (it posts the comments), and CLAUDE_REVIEW_API_KEY as an
# Actions secret and, for Dependabot's PRs, as a Dependabot secret too.
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# One review per PR at a time; a newer run cancels an older one
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # As in the docs example. The comments are posted with the Claude GitHub App's token, which the
    # action gets through id-token; the workflow's own token stays read-only, so it can't approve or push.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_REVIEW_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment posts the findings as inline PR comments instead of only in the run log
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools must name the inline-comment tool (the action only starts its server then) and
          # everything the plugin uses: its own allowed-tools (plugins/code-review/commands/code-review.md
          # in anthropics/claude-code), plus read-only file tools and Task for its parallel reviewers.
          # With only the comment tool, the first review (#30) was refused 10 times and posted nothing.
          # None of these can edit files, push or approve; gh pr comment only posts a comment.
          claude_args: >-
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Read,Grep,Glob,Task"
          # Temporary, for one diagnostic run: prints the whole session (including any refused tool
          # calls) to the run log, which is public on this repo. Remove once reviews work.
          show_full_output: true
          # Dependabot isn't a write-access user, so it has to be allowed by name; no other bots are
          allowed_bots: "dependabot[bot]"
