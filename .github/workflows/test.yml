# Pushes and pull requests run the tests and the build. Nothing deploys on its own:
# deploys are started by hand from the Actions tab ("Run workflow" on main), and then wait
# for a reviewer to approve them in the production environment.
name: Tests and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"   # whatsapp-web.js's Chrome isn't needed for tests
      HUSKY: "0"                        # npm ci skips installing the local git hooks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check       # catches unformatted code, e.g. a commit made with --no-verify
      - run: npm run lint:ci            # fails on any error, or if warnings rise above the count in package.json
      - run: npm test
      - run: npm run build

  deploy:
    needs: test                        # only if every test passed
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production            # waits for a required reviewer; holds the DEPLOY_* secrets
    concurrency: deploy                # two deploys run one after the other, never at once
    steps:
      - name: Run the deploy script on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server only lets this key run scripts/deploy.sh (see authorized_keys)
          ssh -T -o BatchMode=yes -i ~/.ssh/deploy_key root@"$HOST"
