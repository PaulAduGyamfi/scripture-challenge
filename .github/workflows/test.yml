# Pushes and pull requests run the checks: one shared install, then typecheck, lint, format, test
# and build in parallel. Nothing deploys on its own: deploys are started by hand from the Actions
# tab ("Run workflow" on main), and then wait for a reviewer to approve them in the production environment.
#
# Third-party actions are pinned to full commit SHAs; the comment gives the version.
# Required status checks for the "Protect main" ruleset: install, typecheck, lint, format, test, build, security.
name: Tests and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN: the jobs only read the repo
permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: "true" # whatsapp-web.js's Chrome isn't needed for checks
  HUSKY: "0" # npm ci skips installing the local git hooks

jobs:
  # Installs once and saves node_modules; every check below restores it instead of installing again
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run typecheck

  lint:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run lint:ci # fails on any error, or if warnings rise above the count in package.json

  format:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run format:check # catches unformatted code, e.g. a commit made with --no-verify

  test:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run test:coverage # prints the coverage summary; no threshold enforced yet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: warn

  build:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - run: npm run build

  # Supply chain: npm audit reports only (known whatsapp-web.js/puppeteer advisories, see
  # docs/security.md); gitleaks fails the job if the commits being checked contain a secret.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs the history to read the commits
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: npm audit (production dependencies, report only)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Audit summary
        if: always()
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e 'const v = require("./audit.json").metadata.vulnerabilities;
            console.log(`npm audit (production): ${v.critical} critical, ${v.high} high, ${v.moderate} moderate, ${v.low} low. See docs/security.md`)' \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: gitleaks (new commits only)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"                       # the PR's commits
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"                      # the commits this push added
          elif [ "$EVENT" = push ]; then
            range="origin/main..$SHA"                  # a new branch (or force push): everything not on main
          else
            echo "Nothing new to scan on $EVENT"; exit 0
          fi
          echo "Scanning $range"
          ./gitleaks git . --log-opts="$range" --redact --no-banner --verbose

  deploy:
    needs: [typecheck, lint, format, test, build] # only if every check passed
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20                # generous, so a slow npm ci on the server isn't cut off mid-deploy
    environment: production            # waits for a required reviewer; holds the DEPLOY_* secrets
    concurrency: deploy                # two deploys run one after the other, never at once
    steps:
      - name: Run the deploy script on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server only lets this key run scripts/deploy.sh (see authorized_keys)
          ssh -T -o BatchMode=yes -i ~/.ssh/deploy_key root@"$HOST"
